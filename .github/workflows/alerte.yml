name: Alerte zilnice Ivy Trading

on:
  schedule:
    # 12:30 UTC = 13:30 UK (vara) — inainte de deschiderea pietei americane (14:30 UK)
    - cron: "30 12 * * 1-5"
  workflow_dispatch:   # permite si rulare manuala din tab-ul Actions

jobs:
  alerte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaleaza dependinte
        run: pip install yfinance pandas requests

      - name: Ruleaza scanarea si trimite pe Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alerte_telegram.py
